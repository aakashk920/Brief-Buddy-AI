<!DOCTYPE html>
<html>
<head>
  <title>BriefBuddy - Chat</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 700px; margin: 40px auto; padding: 0 20px; }
    nav { margin-bottom: 24px; }
    nav a { margin-right: 16px; color: #059669; text-decoration: none; font-weight: bold; }
    #chat {
      border: 1px solid #D1FAE5; border-radius: 8px;
      height: 420px; overflow-y: auto;
      padding: 16px; margin: 12px 0;
      background: #F9FAFB;
      display: flex; flex-direction: column; gap: 12px;
    }
    .bubble { padding: 10px 14px; border-radius: 8px; max-width: 90%; line-height: 1.5; }
    .q  { background: #DBEAFE; color: #1E3A5F; align-self: flex-end; }
    .a  { background: #D1FAE5; color: #064E3B; align-self: flex-start; }
    .sources { font-size: 12px; color: #6B7280; align-self: flex-start; margin-top: -8px; }
    .thinking { color: #9CA3AF; font-style: italic; align-self: flex-start; }
    .input-row { display: flex; gap: 8px; }
    .input-row input { flex: 1; padding: 10px; font-size: 16px; border: 1px solid #ccc; border-radius: 6px; }
    .input-row button { padding: 10px 20px; background: #059669; color: white; border: none; border-radius: 6px; cursor: pointer; font-size: 16px; }
    .input-row button:disabled { background: #9CA3AF; }
    #no-token { color: #991B1B; }
  </style>
</head>
<body>
  <h1>Ask Your Meetings</h1>
  <nav>
    <a href="index.html">Upload</a>
    <a href="meetings.html">All Meetings</a>
  </nav>

  <div id="no-token" style="display:none">
    No token set. <a href="index.html">Set your token first.</a>
  </div>

  <div id="chat">
    <div class="thinking">Ask anything about your meetings — e.g. "What were the action items?" or "What decisions were made?"</div>
  </div>

  <div class="input-row">
    <input id="q" placeholder="Ask a question about your meetings..." />
    <button id="send-btn" onclick="ask()">Ask</button>
  </div>

  <script>
    const token = localStorage.getItem('token');

    if (!token) {
      document.getElementById('no-token').style.display = 'block';
      document.getElementById('send-btn').disabled = true;
    }

    // Send on Enter key
    document.getElementById('q').addEventListener('keydown', e => {
      if (e.key === 'Enter' && !e.shiftKey) ask();
    });

    async function ask() {
      const input = document.getElementById('q');
      const question = input.value.trim();
      if (!question) return;
      if (!token) return alert('Set your token on the upload page first');

      const chat = document.getElementById('chat');
      const btn  = document.getElementById('send-btn');

      // Show user question
      chat.innerHTML += `<div class="bubble q">${question}</div>`;
      input.value = '';
      btn.disabled = true;

      // Show thinking indicator
      const thinkingId = 'thinking-' + Date.now();
      chat.innerHTML += `<div class="thinking" id="${thinkingId}">Thinking...</div>`;
      chat.scrollTop = chat.scrollHeight;

      try {
        const res = await fetch('/api/chat', {
          method: 'POST',
          headers: {
            'x-token': token,
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({ question })
        });

        // Remove thinking indicator
        document.getElementById(thinkingId)?.remove();

        if (res.status === 401) {
          chat.innerHTML += `<div class="bubble a">Invalid token — go to the upload page and re-enter it.</div>`;
          btn.disabled = false;
          return;
        }

        if (!res.ok) {
          const err = await res.json();
          chat.innerHTML += `<div class="bubble a">Error: ${err.error || 'Unknown error'}</div>`;
          btn.disabled = false;
          return;
        }

        const data = await res.json();
        const answer  = data.answer  || 'No answer returned';
        const sources = data.sources || [];

        // Show answer
        chat.innerHTML += `<div class="bubble a">${answer.replace(/\n/g, '<br>')}</div>`;

        // Show sources if any
        if (sources.length > 0) {
          const srcText = sources
            .map(s => `"${s.title}" (${new Date(s.created_at).toDateString()})`)
            .filter((v, i, a) => a.indexOf(v) === i) // deduplicate
            .join(', ');
          chat.innerHTML += `<div class="sources">Sources: ${srcText}</div>`;
        }

      } catch (err) {
        document.getElementById(thinkingId)?.remove();
        chat.innerHTML += `<div class="bubble a">Network error: ${err.message}</div>`;
      }

      btn.disabled = false;
      chat.scrollTop = chat.scrollHeight;
    }
  </script>
</body>
</html>
